# OpenOCD configuration for WCH CH32V30x RISC-V via WCH-Link
# WCH-Link uses proprietary 'sdi' transport (single debug interface)

# WCH-Link adapter
adapter driver wlinke
adapter speed 6000

# Set the chip family - CH32V30x
set _CHIPNAME ch32v30x

# For sdi transport, we still need to define a TAP even though it's not used the same way
sdi newtap $_CHIPNAME cpu

# Create RISC-V target
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -endian little -chain-position $_TARGETNAME

# Work area in RAM for flash programming (31KB RAM at 0x20000000)
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x7000 -work-area-backup 1

# Flash bank - CH32V30x flash starts at 0x00000000 (per linker script)
# Size 0 means auto-detect
flash bank $_CHIPNAME.flash wch_riscv 0x00000000 0 0 0 $_TARGETNAME

# Reset config - sdi doesn't use standard JTAG resets
reset_config none

# Don't call init here - let the command line handle it to avoid JTAG assertion



